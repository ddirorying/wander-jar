<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="가고 싶은 여행지를 모아두는 버킷리스트 & 무드보드" />
    <link rel="icon" href="/wander-jar/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/wander-jar/apple-touch-icon.png" />
    <title>Wander Jar</title>
    <script>
      // 화면이 깜빡이지 않도록, 저장된 테마를 그리기 전에 적용
      try {
        var t = localStorage.getItem('wj-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
